<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gece</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#05060f; }
  body {
    background:radial-gradient(ellipse at 50% 120%, #1a1542 0%, #0d0b26 45%, #05060f 100%);
  }
  #sky { position:fixed; inset:0; overflow:hidden; }

  .star {
    position:absolute; border-radius:50%; background:#fff;
    animation:twinkle var(--dur) ease-in-out infinite;
    animation-delay:var(--delay);
  }
  @keyframes twinkle {
    0%,100% { opacity:.15; transform:scale(.85); }
    50%     { opacity:1;   transform:scale(1.15); }
  }

  /* yavaş süzülen sis/nebula katmanı */
  .haze {
    position:fixed; border-radius:50%; filter:blur(60px); opacity:.35;
    animation:float 26s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    50%     { transform:translate(4vw,-3vh) scale(1.12); }
  }

  .shooting {
    position:fixed; width:2px; height:2px; border-radius:50%; background:#fff;
    box-shadow:0 0 8px 2px rgba(255,255,255,.7);
    animation:shoot 1.2s linear forwards;
  }
  .shooting::after {
    content:''; position:absolute; top:50%; right:0; width:120px; height:1px;
    transform:translateY(-50%);
    background:linear-gradient(90deg, rgba(255,255,255,.75), transparent);
  }
  @keyframes shoot {
    0%   { transform:translate(0,0); opacity:0; }
    12%  { opacity:1; }
    100% { transform:translate(-46vw,44vh); opacity:0; }
  }
</style>
</head>
<body>
<div id="sky"></div>
<script>
  const sky = document.getElementById('sky');

  // yıldızlar
  for (let i = 0; i < 160; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.4 + 0.6;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--delay', (Math.random() * 5) + 's');
    if (Math.random() > 0.85) s.style.boxShadow = '0 0 6px 1px rgba(255,255,255,.6)';
    sky.appendChild(s);
  }

  // yumuşak renk sisleri
  const hazes = [
    { c:'#3b2a7a', x:20, y:25, s:340 },
    { c:'#5a2a6e', x:72, y:60, s:300 },
    { c:'#22366e', x:45, y:85, s:380 },
  ];
  hazes.forEach((h, i) => {
    const d = document.createElement('div');
    d.className = 'haze';
    d.style.width = h.s + 'px';
    d.style.height = h.s + 'px';
    d.style.left = h.x + 'vw';
    d.style.top = h.y + 'vh';
    d.style.background = h.c;
    d.style.animationDelay = (-i * 8) + 's';
    document.body.insertBefore(d, sky);
  });

  // kayan yıldızlar
  function shootingStar() {
    const sh = document.createElement('div');
    sh.className = 'shooting';
    sh.style.left = (40 + Math.random() * 55) + 'vw';
    sh.style.top = (Math.random() * 35) + 'vh';
    document.body.appendChild(sh);
    setTimeout(() => sh.remove(), 1300);
  }
  setInterval(shootingStar, 3200);
  setTimeout(shootingStar, 1200);
</script>
</body>
</html>
